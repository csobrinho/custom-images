name: wolf-nvidia-driver

# Only this image's inputs trigger a build: a Renovate bump of the Talos release in
# images/wolf-nvidia-driver/image.yaml rebuilds this image and nothing else. PRs build without
# pushing; main pushes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/wolf-nvidia-driver/**
      - .github/workflows/wolf-nvidia-driver.yml
  pull_request:
    paths:
      - images/wolf-nvidia-driver/**
      - .github/workflows/wolf-nvidia-driver.yml

concurrency:
  group: wolf-nvidia-driver-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/wolf-nvidia-driver
  SPEC: images/wolf-nvidia-driver/image.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image spec
        id: spec
        run: |
          {
            echo "upstream=$(yq -r '.upstream' "$SPEC")"
            echo "ref=$(yq -r '.ref' "$SPEC")"
            echo "context=$(yq -r '.context' "$SPEC")"
            echo "target=$(yq -r '.target' "$SPEC")"
            echo "driver_branch=$(yq -r '.driverBranch' "$SPEC")"
            echo "version=$(yq -r '.version' "$SPEC")"
          } >> "$GITHUB_OUTPUT"

      # The driver must be the one Talos loads, so it comes from the extensions repo at the same
      # release, never from NVIDIA's latest.
      - name: Checkout Talos extensions
        uses: actions/checkout@v7
        with:
          repository: siderolabs/extensions
          ref: ${{ steps.spec.outputs.version }}
          path: talos-extensions
          sparse-checkout: nvidia-gpu/vars.yaml
          sparse-checkout-cone-mode: false

      - name: Resolve the NVIDIA driver version
        id: driver
        env:
          BRANCH: ${{ steps.spec.outputs.driver_branch }}
          TALOS: ${{ steps.spec.outputs.version }}
        run: |
          key="NVIDIA_DRIVER_${BRANCH^^}_VERSION"
          version=$(yq -r ".${key} // \"\"" talos-extensions/nvidia-gpu/vars.yaml)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::${key} not found in siderolabs/extensions nvidia-gpu/vars.yaml (got '${version}')"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Talos ${TALOS}: NVIDIA ${BRANCH} driver ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.spec.outputs.upstream }}
          ref: ${{ steps.spec.outputs.ref }}
          path: upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Fork PRs get no packages:write token: build only, no cache writes.
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.spec.outputs.version }}
            type=raw,value=${{ steps.driver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.driver.outputs.version }}
            org.opencontainers.image.url=https://github.com/${{ steps.spec.outputs.upstream }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: upstream/${{ steps.spec.outputs.context }}
          target: ${{ steps.spec.outputs.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NV_VERSION=${{ steps.driver.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && format('type=registry,ref={0}:buildcache,mode=min', env.IMAGE) || '' }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
