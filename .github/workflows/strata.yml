name: strata

# Only this image's inputs trigger a build: a Renovate bump of images/strata/image.yaml rebuilds
# Strata and nothing else. PRs build without pushing; main pushes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/strata/**
      - .github/workflows/strata.yml
      - .github/workflows/build-image.yml
  pull_request:
    paths:
      - images/strata/**
      - .github/workflows/strata.yml
      - .github/workflows/build-image.yml

concurrency:
  group: strata-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      image: strata
      # The CUDA devel base + compiled engine don't fit in a stock runner's free disk.
      free-disk-space: true
      timeout-minutes: 300
