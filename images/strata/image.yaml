# Strata (Qwen3.8-Flash-Next MoE engine) built from the upstream Dockerfile at a pinned tag.
# Published as ghcr.io/csobrinho/strata:<version>.
upstream: Niko1221/Strata
# renovate: datasource=github-releases depName=Niko1221/Strata
version: v0.2.1
buildArgs:
  CUDA_ARCHITECTURES: "120" # RTX 5090 only; cuts the CUDA compile a lot.
  BUILD_VISION: "0"
# Upstream builds the engine portable (AVX2); tune it for the host's EPYC 7J13 (Zen 3).
prepare: |
  sed -i 's/-DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=OFF/& -DCMAKE_C_FLAGS=-march=znver3 -DCMAKE_CXX_FLAGS=-march=znver3/' Dockerfile
  grep -q -- '-DCMAKE_CXX_FLAGS=-march=znver3' Dockerfile
